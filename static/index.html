<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Embedding Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Text Embedding Visualizer</h1>
        <div class="embed-form">
            <input 
                type="text" 
                id="textInput" 
                placeholder="Enter text to embed..." 
                class="text-input"
            >
            <button id="submitBtn" class="submit-btn">Embed Text</button>
        </div>

        <div id="loadingSpinner" class="loading-spinner hidden"></div>

        <div id="resultContainer" class="result-container hidden">
            <h2>Embedding Result</h2>
            <div class="result-info">
                <p><strong>Input Text:</strong> <span id="inputText"></span></p>
                <p><strong>Vector Dimension:</strong> <span id="vectorDim"></span></p>
            </div>
            <div class="vector-display">
                <h3>Vector Values:</h3>
                <div id="vectorOutput" class="vector-output"></div>
            </div>
            <button id="copyBtn" class="copy-btn">Copy Vector as JSON</button>
        </div>

        <div id="errorContainer" class="error-container hidden">
            <p id="errorMessage"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
